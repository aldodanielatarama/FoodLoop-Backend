spring.application.name=foodloop-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodloop_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
foodloop.jwt.secret=${FOODLOOP_JWT_SECRET:}
foodloop.maps.api-key=${GOOGLE_MAPS_API_KEY:}
